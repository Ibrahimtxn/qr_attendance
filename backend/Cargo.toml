[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-files = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
deadpool-postgres = "0.12"
tokio-postgres = "0.7"
dotenv = "0.15"
jsonwebtoken = "9"
md5 = "0.7"
qrcode = "0.14"
image = "0.25"
base64 = "0.22"
env_logger = "0.11"
